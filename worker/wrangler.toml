# Joudy Architecture Studio — AI backend (Cloudflare Workers, free plan is enough).
name = "joudy-ai"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "BudgetLedger"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetLedger"]

[vars]
# Keep "false" until a provider whose terms permit use from Syria is configured.
AI_ENABLED = "false"
PROVIDER_NAME = ""
PROVIDER_BASE_URL = ""          # OpenAI-compatible base URL ending in /v1 (or the provider's equivalent)
PROVIDER_MODEL = ""
PRICE_INPUT_USD_PER_MTOK = "0"  # copy from the provider's CURRENT pricing page
PRICE_OUTPUT_USD_PER_MTOK = "0"
USD_TO_EUR = "0.95"             # set conservatively (a higher value over-estimates cost)
MONTHLY_LIMIT_EUR = "4.5"       # hard cap; code clamps it to at most 5
MAX_OUTPUT_TOKENS = "1200"
MAX_REQUESTS_PER_DAY = "60"
MAX_IMAGE_BYTES = "1500000"
TOKENS_PER_IMAGE = "1800"       # conservative per-image input estimate used for reservations
SAFETY_MARGIN = "1.25"
ALLOWED_ORIGINS = "https://YOUR-GITHUB-USERNAME.github.io"

# Secrets (never put them here):
#   npx wrangler secret put PROVIDER_API_KEY
#   npx wrangler secret put ACCESS_TOKEN_SHA256
